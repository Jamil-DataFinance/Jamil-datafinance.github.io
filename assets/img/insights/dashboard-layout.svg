<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1000" height="480" fill="#f5f7fa"/>
  <rect x="40" y="30" width="920" height="420" rx="16" fill="#fff" stroke="#dde3ea" stroke-width="2"/>

  <!-- header -->
  <text x="70" y="74" font-size="21" font-weight="800" fill="#1a2e4a">Monthly performance</text>
  <rect x="690" y="52" width="110" height="32" rx="16" fill="#e8f0f9"/>
  <text x="745" y="73" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2e4a">FY 2026</text>
  <rect x="810" y="52" width="122" height="32" rx="16" fill="#e8f0f9"/>
  <text x="871" y="73" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2e4a">All entities</text>

  <!-- KPI cards -->
  <g fill="#f5f7fa">
    <rect x="70" y="100" width="205" height="100" rx="12"/><rect x="295" y="100" width="205" height="100" rx="12"/>
    <rect x="520" y="100" width="205" height="100" rx="12"/><rect x="745" y="100" width="185" height="100" rx="12"/>
  </g>
  <g font-size="14" fill="#5b6673">
    <text x="88" y="128">Revenue</text><text x="313" y="128">EBITDA</text><text x="538" y="128">Gross margin</text><text x="763" y="128">Cash</text>
  </g>
  <g font-size="28" font-weight="800" fill="#1a2e4a">
    <text x="88" y="164">12.4M</text><text x="313" y="164">2.1M</text><text x="538" y="164">38.5%</text><text x="763" y="164">5.6M</text>
  </g>
  <g font-size="13" font-weight="700">
    <text x="88" y="188" fill="#1d9e75">▲ 4.0% vs budget</text>
    <text x="313" y="188" fill="#c2410c">▼ 2.1% vs budget</text>
    <text x="538" y="188" fill="#1d9e75">▲ 1.1 pts vs prior year</text>
    <text x="763" y="188" fill="#1d9e75">▲ 0.8M vs prior year</text>
  </g>

  <!-- trend chart -->
  <text x="70" y="244" font-size="15" font-weight="700" fill="#1a2e4a">Actual vs budget vs prior year</text>
  <g stroke="#eef1f5" stroke-width="2"><path d="M70 300 H590 M70 345 H590 M70 390 H590"/></g>
  <path d="M80 380 L127 372 L174 368 L221 360 L268 352 L315 348 L362 340 L409 333 L456 326 L503 320 L550 312 L580 306" fill="none" stroke="#9aa5b1" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M80 392 L127 386 L174 384 L221 378 L268 372 L315 370 L362 364 L409 356 L456 352 L503 346 L550 340 L580 336" fill="none" stroke="#8fb3d9" stroke-width="3"/>
  <path d="M80 376 L127 366 L174 370 L221 352 L268 344 L315 346 L362 330 L409 322 L456 318 L503 306 L550 298 L580 290" fill="none" stroke="#1d9e75" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-size="13" fill="#5b6673">
    <rect x="70" y="414" width="22" height="5" rx="2" fill="#1d9e75"/><text x="98" y="420">Actual</text>
    <rect x="160" y="414" width="22" height="5" rx="2" fill="#9aa5b1"/><text x="188" y="420">Budget</text>
    <rect x="250" y="414" width="22" height="5" rx="2" fill="#8fb3d9"/><text x="278" y="420">Prior year</text>
  </g>

  <!-- variance bars -->
  <text x="630" y="244" font-size="15" font-weight="700" fill="#1a2e4a">Biggest variances vs budget</text>
  <path d="M810 262 V420" stroke="#c9d6e6" stroke-width="2"/>
  <g font-size="14" fill="#1a2e4a">
    <text x="630" y="290">Revenue</text><text x="630" y="326">Staff costs</text>
    <text x="630" y="362">Marketing</text><text x="630" y="398">Rent</text>
  </g>
  <rect x="810" y="276" width="110" height="20" rx="4" fill="#1d9e75"/>
  <rect x="740" y="312" width="70" height="20" rx="4" fill="#e8743b"/>
  <rect x="765" y="348" width="45" height="20" rx="4" fill="#e8743b"/>
  <rect x="810" y="384" width="38" height="20" rx="4" fill="#1d9e75"/>
</svg>
