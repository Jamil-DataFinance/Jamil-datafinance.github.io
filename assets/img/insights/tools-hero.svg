<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="520" fill="#eef4fa"/>
  <circle cx="1120" cy="480" r="160" fill="#e3f3ed"/>
  <circle cx="60" cy="40" r="130" fill="#dfe9f5"/>

  <!-- connectors to the decision bar -->
  <g stroke="#c9d6e6" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M180 340 V380 H1020 V340"/><path d="M460 340 V380"/><path d="M740 340 V380"/><path d="M600 380 V405"/>
  </g>

  <!-- cards -->
  <g fill="#fff" stroke="#dde3ea" stroke-width="2">
    <rect x="70" y="90" width="220" height="250" rx="18"/>
    <rect x="350" y="90" width="220" height="250" rx="18"/>
    <rect x="630" y="90" width="220" height="250" rx="18"/>
    <rect x="910" y="90" width="220" height="250" rx="18"/>
  </g>

  <!-- AI sparkles on every card -->
  <g fill="#f2b84b">
    <path transform="translate(266 116)" d="M0 -14 C2 -3 3 -2 14 0 C3 2 2 3 0 14 C-2 3 -3 2 -14 0 C-3 -2 -2 -3 0 -14Z"/>
    <path transform="translate(546 116)" d="M0 -14 C2 -3 3 -2 14 0 C3 2 2 3 0 14 C-2 3 -3 2 -14 0 C-3 -2 -2 -3 0 -14Z"/>
    <path transform="translate(826 116)" d="M0 -14 C2 -3 3 -2 14 0 C3 2 2 3 0 14 C-2 3 -3 2 -14 0 C-3 -2 -2 -3 0 -14Z"/>
    <path transform="translate(1106 116)" d="M0 -14 C2 -3 3 -2 14 0 C3 2 2 3 0 14 C-2 3 -3 2 -14 0 C-3 -2 -2 -3 0 -14Z"/>
  </g>

  <!-- Excel: grid -->
  <rect x="120" y="128" width="120" height="96" rx="8" fill="#e3f3ed" stroke="#08503f" stroke-width="3"/>
  <path d="M160 128 V224 M200 128 V224 M120 160 H240 M120 192 H240" stroke="#08503f" stroke-width="3"/>
  <rect x="160" y="160" width="40" height="32" fill="#1d9e75"/>

  <!-- Power Query: messy data through a funnel -->
  <circle cx="417" cy="132" r="7" fill="#f2b84b"/><circle cx="442" cy="144" r="6" fill="#1d9e75"/>
  <circle cx="472" cy="128" r="8" fill="#8fb3d9"/><circle cx="502" cy="142" r="6" fill="#f2b84b"/>
  <circle cx="457" cy="118" r="5" fill="#1a2e4a"/>
  <path d="M405 160 H515 L475 200 V222 L445 236 V200 Z" fill="#1a2e4a"/>

  <!-- Power BI: bars -->
  <path d="M672 236 H826" stroke="#c9d6e6" stroke-width="3"/>
  <rect x="682" y="186" width="26" height="50" rx="4" fill="#8fb3d9"/>
  <rect x="718" y="156" width="26" height="80" rx="4" fill="#1d9e75"/>
  <rect x="754" y="126" width="26" height="110" rx="4" fill="#1a2e4a"/>
  <rect x="790" y="171" width="26" height="65" rx="4" fill="#f2b84b"/>

  <!-- Python: code window -->
  <rect x="955" y="125" width="130" height="105" rx="10" fill="#1a2e4a"/>
  <circle cx="972" cy="141" r="5" fill="#f2b84b"/><circle cx="987" cy="141" r="5" fill="#1d9e75"/><circle cx="1002" cy="141" r="5" fill="#fff"/>
  <text x="1020" y="202" text-anchor="middle" font-size="34" font-weight="800" fill="#5cc4a2">&lt;/&gt;</text>

  <!-- labels -->
  <g text-anchor="middle" fill="#1a2e4a" font-size="24" font-weight="800">
    <text x="180" y="278">Excel</text><text x="460" y="278">Power Query</text>
    <text x="740" y="278">Power BI</text><text x="1020" y="278">Python</text>
  </g>
  <g text-anchor="middle" fill="#5b6673" font-size="17">
    <text x="180" y="308">Model &amp; plan</text><text x="460" y="308">Clean &amp; combine</text>
    <text x="740" y="308">Report &amp; monitor</text><text x="1020" y="308">Automate at scale</text>
  </g>

  <!-- decisions -->
  <rect x="360" y="405" width="480" height="64" rx="32" fill="#1a2e4a"/>
  <path transform="translate(420 437)" d="M0 -16 C2 -4 4 -2 16 0 C4 2 2 4 0 16 C-2 4 -4 2 -16 0 C-4 -2 -2 -4 0 -16Z" fill="#f2b84b"/>
  <text x="615" y="445" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Better, faster decisions</text>
</svg>
