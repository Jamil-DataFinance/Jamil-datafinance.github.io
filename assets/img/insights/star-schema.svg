<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1000" height="440" fill="#f5f7fa"/>

  <g stroke="#8fb3d9" stroke-width="4">
    <path d="M500 220 L200 85 M500 220 L800 85 M500 220 L200 345 M500 220 L800 345"/>
  </g>
  <!-- one-to-many markers -->
  <g font-size="18" font-weight="800" fill="#08503f" text-anchor="middle">
    <text x="322" y="128">1</text><text x="678" y="128">1</text><text x="322" y="322">1</text><text x="678" y="322">1</text>
  </g>
  <g font-size="24" font-weight="800" fill="#08503f" text-anchor="middle">
    <text x="350" y="156">*</text><text x="650" y="156">*</text><text x="350" y="306">*</text><text x="650" y="306">*</text>
  </g>
  <text x="500" y="420" text-anchor="middle" font-size="14" fill="#5b6673">1 = one row per item in the dimension   ·   * = many rows in the fact table</text>

  <!-- dimensions -->
  <g fill="#fff" stroke="#1d9e75" stroke-width="3">
    <rect x="90" y="40" width="220" height="90" rx="14"/><rect x="690" y="40" width="220" height="90" rx="14"/>
    <rect x="90" y="300" width="220" height="90" rx="14"/><rect x="690" y="300" width="220" height="90" rx="14"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="800" fill="#1d9e75" letter-spacing="2">
    <text x="200" y="72">DIMENSION</text><text x="800" y="72">DIMENSION</text>
    <text x="200" y="332">DIMENSION</text><text x="800" y="332">DIMENSION</text>
  </g>
  <g text-anchor="middle" font-size="22" font-weight="800" fill="#1a2e4a">
    <text x="200" y="105">Date</text><text x="800" y="105">Account</text>
    <text x="200" y="365">Entity</text><text x="800" y="365">Scenario</text>
  </g>

  <!-- fact -->
  <rect x="370" y="168" width="260" height="104" rx="14" fill="#1a2e4a"/>
  <text x="500" y="203" text-anchor="middle" font-size="13" font-weight="800" fill="#5cc4a2" letter-spacing="2">FACT TABLE</text>
  <text x="500" y="236" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">GL transactions</text>
  <text x="500" y="258" text-anchor="middle" font-size="14" fill="#c4d2e3">Actual · Budget · Prior year</text>
</svg>
